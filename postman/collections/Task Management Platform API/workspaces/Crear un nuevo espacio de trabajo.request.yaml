$kind: http-request
url: "{{baseUrl}}/workspaces"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "name": "<string>"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Crear un nuevo espacio de trabajo.resources/examples
order: 1000
