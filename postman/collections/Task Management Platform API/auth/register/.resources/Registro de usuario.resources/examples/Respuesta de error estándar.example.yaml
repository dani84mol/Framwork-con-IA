$kind: http-example
request:
  url: "{{baseUrl}}/auth/register"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "<email>",
        "password": "<string>",
        "name": "<string>"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": "<integer>",
        "message": "<string>",
        "error": "<string>"
      }
order: 2000
