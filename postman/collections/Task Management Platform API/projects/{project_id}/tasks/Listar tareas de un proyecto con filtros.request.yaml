$kind: http-request
url: "{{baseUrl}}/projects/:project_id/tasks?status=DONE&priority=LOW"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: status
    value: DONE
    description: " (This can only be one of TODO,IN_PROGRESS,DONE)"
  - key: priority
    value: LOW
    description: " (This can only be one of HIGH,MEDIUM,LOW)"
pathVariables:
  - key: project_id
    value: <uuid>
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Listar tareas de un proyecto con filtros.resources/examples
order: 1000
