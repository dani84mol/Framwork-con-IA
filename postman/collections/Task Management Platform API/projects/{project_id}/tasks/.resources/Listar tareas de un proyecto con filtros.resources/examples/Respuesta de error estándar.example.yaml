$kind: http-example
request:
  url: "{{baseUrl}}/projects/:project_id/tasks?status=DONE&priority=LOW"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: status
      value: DONE
      description: " (This can only be one of TODO,IN_PROGRESS,DONE)"
    - key: priority
      value: LOW
      description: " (This can only be one of HIGH,MEDIUM,LOW)"
  pathVariables:
    - key: project_id
      value: <uuid>
      description: "(Required) "
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "statusCode": "<integer>",
        "message": "<string>",
        "error": "<string>"
      }
order: 2000
