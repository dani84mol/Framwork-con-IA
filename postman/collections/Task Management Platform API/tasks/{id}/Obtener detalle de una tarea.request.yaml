$kind: http-request
url: "{{baseUrl}}/tasks/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: <uuid>
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Obtener detalle de una tarea.resources/examples
order: 2000
