$kind: http-request
url: "{{baseUrl}}/tasks/:id"
method: PUT
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <uuid>
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "title": "<string>",
      "description": "<string>",
      "status": "DONE",
      "priority": "MEDIUM",
      "assigned_to": "<uuid>",
      "due_date": "<dateTime>"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Actualizar una tarea.resources/examples
order: 3000
