$kind: http-example
request:
  url: "{{baseUrl}}/tasks/:id"
  method: DELETE
  headers:
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: <uuid>
      description: "(Required) "
response:
  statusCode: 204
  statusText: No Content
  body:
    type: text
    content: ""
order: 1000
