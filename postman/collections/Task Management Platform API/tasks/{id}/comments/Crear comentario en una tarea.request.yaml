$kind: http-request
url: "{{baseUrl}}/tasks/:id/comments"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: <uuid>
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "content": "<string>"
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Crear comentario en una tarea.resources/examples
order: 2000
